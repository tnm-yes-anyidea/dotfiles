# ==========================================
# TERMINAL & HISTORY CONFIG
# ==========================================
set -g default-terminal "screen-256color"
# Enable RGB/TrueColor support (Crucial for modern terminal colors)
set -as terminal-overrides ",xterm-256color:Tc"
set -g mouse on
set -g history-limit 10000

# ==========================================
# NATIVE BEAUTIFICATION (Green & Dark Theme)
# ==========================================

# 1. Status Bar Overall Style
set -g status-style bg=#1a1a1a,fg=#00ff66 
set -g status-interval 5
set -g status-justify left # Align window list to the left

# 2. Left Status: Solid Green Block for Session Name
set -g status-left-length 40
set -g status-left "#[fg=#1a1a1a,bg=#00ff66,bold] ❐ #S #[bg=default,fg=#00ff66,nobold] │ "

# 3. Right Status: Minimalist Date & Time
set -g status-right-length 100
set -g status-right "#[fg=#444444] │ #[fg=#00ff66,bold]%A, %b %d #[fg=#444444]│ #[fg=#00ff66,bold]%H:%M "

# 4. Inactive Window Tabs (Subtle Gray-Green)
set -g window-status-style fg=#555555,bg=default
set -g window-status-format " #I:#W "

# 5. Active Window Tab (Bright Highlight with Indicator)
set -g window-status-current-style fg=#00ff66,bg=#2d2d2d,bold
set -g window-status-current-format " #[fg=#00ff66]● #[fg=white]#I:#W "

# 6. Pane Borders (The actual "Green Lines" when splitting windows)
set -g pane-border-style fg=#2d2d2d              # Dark gray for inactive splits
set -g pane-active-border-style fg=#00ff66       # Vibrant neon green for the active split

# 7. Command Mode / Message Styles (Ctrl+b : )
set -g message-style bg=#00ff66,fg=#1a1a1a,bold

# ==========================================
# PLUGINS (Kept from your original config)
# ==========================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Automatic restore when tmux is started
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this at the very bottom)
run '~/.tmux/plugins/tpm'
